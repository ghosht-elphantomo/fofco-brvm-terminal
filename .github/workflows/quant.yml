name: quant-data

# Terminal FQT (dossier quant/) : relève QQQ (Yahoo/Nasdaq) et la séance BRVM (brvm.org) toutes les 15 min,
# reconstruit toute la base chaque soir (BRVM depuis 2006, US, macro) et publie le site complet
# (index.html + data/) sur la branche quant-data, réécrite à chaque passage.
# Heures UTC, lun-ven : BRVM 09:00-15:30, Nasdaq 13:30-20:00.
on:
  schedule:
    - cron: "*/30 9-12 * * 1-5"    # matinée BRVM
    - cron: "*/15 13-20 * * 1-5"   # séance US (+ fin de séance BRVM)
    - cron: "35 22 * * 1-5"        # EOD : base complète
  workflow_dispatch:
    inputs:
      mode:
        description: "live (cours) ou eod (base complète)"
        type: choice
        options: [eod, live]
        default: eod
  push:
    branches: [main]
    paths: ["quant/**", ".github/workflows/quant.yml"]

permissions:
  contents: write

concurrency:
  group: quant-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Mode
        id: mode
        run: |
          MODE=live
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          if [ "${{ github.event.schedule }}" = "35 22 * * 1-5" ]; then MODE=eod; fi
          if [ "${{ github.event_name }}" = "push" ]; then MODE=eod; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Restaurer le site précédent (branche quant-data)
        run: |
          mkdir -p /tmp/site /tmp/state
          cp quant/seed/brvm.json /tmp/state/brvm.json
          if git fetch -q --depth 1 origin quant-data; then
            git archive FETCH_HEAD | tar -x -C /tmp/site || true
            if [ -f /tmp/site/data/session.json ]; then cp /tmp/site/data/session.json /tmp/state/brvm.json; fi
          fi

      - name: Relever les cours (QQQ + séance BRVM)
        run: python3 quant/scripts/scrape.py --mode "${{ steps.mode.outputs.mode }}" --state /tmp/state --out /tmp/site

      - name: Reconstruire la base complète (EOD ou base absente)
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "eod" ] || [ ! -f /tmp/site/data/summary.json ]; then
            git clone -q --depth 1 https://github.com/harzat/brvm-data-public.git /tmp/brvmsrc
            python3 quant/scripts/build_terminal.py --brvm-src /tmp/brvmsrc --out /tmp/site/data --session /tmp/state/brvm.json
          fi

      - name: Publier sur la branche quant-data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp quant/index.html /tmp/site/index.html
          touch /tmp/site/.nojekyll
          printf '{"headers":[{"source":"/data/(.*)","headers":[{"key":"Cache-Control","value":"no-store"}]},{"source":"/(.*)","headers":[{"key":"X-Robots-Tag","value":"noindex, nofollow"}]}]}\n' > /tmp/site/vercel.json
          cd /tmp/site
          rm -rf .git
          git init -q -b quant-data
          git config user.name "quant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Données $(date -u +'%d/%m/%Y %H:%M') UTC"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" quant-data

      - name: Archiver la séance BRVM sur main (EOD)
        if: steps.mode.outputs.mode == 'eod'
        run: |
          git config user.name "quant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quant/seed/brvm.json quant/seed/brvm_daily.csv
          if git diff --cached --quiet; then echo "Rien à archiver"; else git commit -qm "quant: séance BRVM $(date -u +%F)" && git pull -q --rebase origin main && git push -q origin HEAD:main; fi
