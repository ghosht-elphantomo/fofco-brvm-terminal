name: Rattrapage de l'historique ancien

# À lancer à la main (onglet Actions) : récupère chez SikaFinance les séances antérieures
# au début du miroir public, les enregistre dans history/ puis relance la mise à jour des données.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer le miroir public
        run: git clone --depth 1 https://github.com/harzat/brvm-data-public.git /tmp/src

      - name: Rattraper l'historique SikaFinance
        run: python pipeline/backfill_sika.py --src /tmp/src --out history

      - name: Enregistrer history/
        run: |
          git config user.name "fofco-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          git diff --cached --quiet && exit 0
          git commit -qm "Historique ancien rattrapé chez SikaFinance"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      - name: Relancer la mise à jour des données
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update.yml --ref main
