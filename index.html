<meta charset="utf-8">
<title>FOFCO BRVM Terminal</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : terminal de cote en une colonne. En-tête collant (séance + indices), rail d'onglets, vues denses en tableaux. */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --surface2:#E4E9E2; --ink:#14201A; --muted:#5B6961; --line:#D3DBD2; --grid:#E6EBE4;
  --accent:#946410; --accent-soft:#F2E7CE; --accent-ink:#5E3F06;
  --up:#14774A; --down:#B4361F; --warn:#9C6400; --up-soft:#DAEEE1; --down-soft:#F6DED7; --warn-soft:#F4E7C6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1310; --surface:#131C18; --surface2:#1A2520; --ink:#E3EBE5; --muted:#91A198; --line:#25322B; --grid:#1C2722;
  --accent:#E3AE4F; --accent-soft:#33291A; --accent-ink:#F4D79E;
  --up:#45C285; --down:#F2765F; --warn:#E6AA3E; --up-soft:#15301F; --down-soft:#3A1C16; --warn-soft:#382C12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1310; --surface:#131C18; --surface2:#1A2520; --ink:#E3EBE5; --muted:#91A198; --line:#25322B; --grid:#1C2722;
  --accent:#E3AE4F; --accent-soft:#33291A; --accent-ink:#F4D79E;
  --up:#45C285; --down:#F2765F; --warn:#E6AA3E; --up-soft:#15301F; --down-soft:#3A1C16; --warn-soft:#382C12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)} .muted{color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font:800 20px/1 var(--f-display);letter-spacing:-.02em}
.brand span{font:600 12px/1 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sess{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-align:right;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--up);box-shadow:0 0 0 4px var(--up-soft)}
.strip{display:flex;gap:18px;overflow-x:auto;padding-block:2px 8px;scrollbar-width:none;font-size:12.5px}
.strip::-webkit-scrollbar{display:none}
.strip div{white-space:nowrap}
.strip b{font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:0 8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:7px 11px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs button:hover:not([aria-selected="true"]){background:var(--surface2);color:var(--ink)}

main{padding-block:16px 48px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:800}
h2{font-size:18px;font-weight:800}
h3{font-size:14px;font-weight:600;font-family:var(--f-body);letter-spacing:0}
.eyebrow{font:600 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel>h2,.panel>h3{margin-bottom:10px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.note{font-size:12px;color:var(--muted);max-width:70ch}
.big{font:800 28px/1.05 var(--f-display);letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}

/* Pastilles */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--ink);white-space:nowrap}
.chip.g{background:var(--up-soft);color:var(--up)} .chip.r{background:var(--down-soft);color:var(--down)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.wrap{white-space:normal} .chip.a{background:var(--accent-soft);color:var(--accent-ink)}
.fofdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle}
.score{display:inline-flex;align-items:center;gap:6px}
.score i{display:block;width:34px;height:5px;border-radius:3px;background:var(--surface2);position:relative;overflow:hidden}
.score i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--c,var(--accent))}

/* Contrôles */
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:3px 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow-x:auto;max-width:100%;background:var(--surface);scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;padding:5px 10px;white-space:nowrap;flex:none;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
input[type=text],input[type=number],input[type=search],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;min-width:0}
input[type=number]{width:90px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);font-weight:600}
label.c{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end}
details.more>summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ "}
details.more[open]>summary::before{content:"− "}

/* Tableaux */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--grid)}
th{font:600 11px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface);position:sticky;top:0;z-index:1}
th.s{cursor:pointer;user-select:none} th.s:hover{color:var(--ink)}
th.sorted{color:var(--accent)}
td.n,th.n{text-align:right}
tbody tr:hover td{background:var(--surface2)}
tbody tr.click{cursor:pointer}
td.stick,th.stick{position:sticky;left:0;background:var(--surface);z-index:2;box-shadow:1px 0 0 var(--grid)}
tbody tr:hover td.stick{background:var(--surface2)}
.tk{font:600 12.5px var(--f-mono)}
.nm{display:block;font-size:11.5px;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis}
.posbar{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--surface2);position:relative;vertical-align:middle;margin-right:6px}
.posbar b{position:absolute;top:-2px;width:3px;height:10px;border-radius:2px;background:var(--ink);left:calc(var(--p) * 1%)}
.heat td{text-align:center;font-size:11.5px;padding:5px 4px;min-width:42px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Graphiques */
.chart{width:100%;height:340px;position:relative}
.chart.sm{height:150px}
.chart.xs{height:120px}
.spark{display:block;width:100%;height:36px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.vp{display:flex;flex-direction:column-reverse;gap:1px}
.vp div{display:flex;align-items:center;gap:6px;font:11px var(--f-mono);color:var(--muted)}
.vp span{width:64px;text-align:right;flex:none}
.vp i{height:8px;border-radius:2px;background:var(--line);display:block}
.vp div.va i{background:var(--accent-soft)} .vp div.poc i{background:var(--accent)}
.gauge{display:flex;gap:3px;margin-top:6px}
.gauge span{flex:1;height:6px;border-radius:3px;background:var(--surface2)}
.gauge span.on{background:var(--c)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;max-width:min(92vw,520px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.hide-sm{} @media (max-width:640px){.hide-sm{display:none} h1{font-size:22px} .chart{height:280px} .brand span{display:none}}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .25s ease-out}@keyframes f{from{opacity:.4}to{opacity:1}}}
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><b>FOFCO</b><span>BRVM Terminal</span></div>
      <div class="sess" id="sess"><span class="dot"></span><span>Chargement…</span></div>
    </div>
    <div class="strip" id="strip"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="wrap" id="view"><div class="empty">Chargement des données…</div></main>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
'use strict';
/* ============================== Outils ============================== */
const DAY = 864e5;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF = [0,1,2].map(d => new Intl.NumberFormat('fr-FR', {minimumFractionDigits:d, maximumFractionDigits:d}));
const ok = x => x != null && isFinite(x);
const F = {
  n: (x, d = 0) => ok(x) ? NF[d].format(x) : '—',
  p: (x, d = 1) => ok(x) ? (x > 0 ? '+' : '') + NF[d].format(x) + ' %' : '—',
  pu: (x, d = 1) => ok(x) ? NF[d].format(x) + ' %' : '—',
  px: x => ok(x) ? NF[Math.abs(x) < 100 && x % 1 ? 2 : 0].format(x) : '—',
  big: x => { if (!ok(x)) return '—'; const a = Math.abs(x);
    if (a >= 1e12) return NF[2].format(x/1e12) + ' T'; if (a >= 1e9) return NF[1].format(x/1e9) + ' Md';
    if (a >= 1e6) return NF[1].format(x/1e6) + ' M'; if (a >= 1e3) return NF[0].format(x/1e3) + ' k'; return NF[0].format(x); },
  d: day => day == null ? '—' : new Date(day*DAY).toLocaleDateString('fr-FR', {timeZone:'UTC', day:'2-digit', month:'2-digit', year:'numeric'}),
  dshort: day => day == null ? '—' : new Date(day*DAY).toLocaleDateString('fr-FR', {timeZone:'UTC', day:'2-digit', month:'short'}),
  iso: s => s ? `${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}` : '—',
  dt: s => { if (!s) return '—'; const t = new Date(s); return isNaN(t) ? s : t.toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}); },
};
const isoDay = s => s ? Math.floor(Date.parse(s.slice(0,10) + 'T00:00:00Z') / DAY) : null;
const TODAY = Math.floor(Date.now() / DAY);
const cls = x => !ok(x) ? 'flat' : x > 0 ? 'up' : x < 0 ? 'down' : 'flat';
const MOIS = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const mean = a => { let s = 0, n = 0; for (const x of a) if (ok(x)) { s += x; n++; } return n ? s/n : null; };
const median = a => { const b = a.filter(ok).sort((x,y) => x-y); if (!b.length) return null; const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m-1] + b[m]) / 2; };
const stdev = a => { const b = a.filter(ok); if (b.length < 2) return null; const m = mean(b); return Math.sqrt(b.reduce((s,x) => s + (x-m)**2, 0) / (b.length - 1)); };
const clamp = (x, a = 0, b = 100) => Math.max(a, Math.min(b, x));
const lin = (x, x0, y0, x1, y1) => clamp(y0 + (x - x0) * (y1 - y0) / (x1 - x0), Math.min(y0, y1), Math.max(y0, y1));
const last = a => a[a.length - 1];
function logInterp(x, A) { if (!(x > A[0][0])) return A[0][1];
  for (let i = 1; i < A.length; i++) { const [x0,y0] = A[i-1], [x1,y1] = A[i];
    if (x <= x1) return y0 + (Math.log(x) - Math.log(x0)) / (Math.log(x1) - Math.log(x0)) * (y1 - y0); }
  return last(A)[1]; }
function pctRank(v, arr) { const b = arr.filter(ok); if (!ok(v) || b.length < 2) return null; let lo = 0, eq = 0; for (const x of b) { if (x < v) lo++; else if (x === v) eq++; } return (lo + 0.5*eq) / b.length * 100; }
function cagr(series, years = 4, minYears = 3) {
  // series : {"2021": v, ...} -> taux annuel moyen sur les `years` derniers exercices, départ et arrivée positifs
  const ks = Object.keys(series || {}).filter(k => ok(series[k])).sort(); if (ks.length < minYears) return null;
  const sel = ks.slice(-(years + 1)); const a = series[sel[0]], b = series[last(sel)], n = (+last(sel)) - (+sel[0]);
  if (!(a > 0 && b > 0 && n >= minYears - 1)) return null; return (Math.pow(b/a, 1/n) - 1) * 100; }
function lastTwo(series) { const ks = Object.keys(series || {}).filter(k => ok(series[k])).sort(); if (ks.length < 2) return null;
  const a = series[ks[ks.length-2]], b = series[last(ks)]; return a ? (b - a) / Math.abs(a) * 100 : null; }
function wilson(k, n, z = 1.96) { if (!n) return [0,1]; const p = k/n, d = 1 + z*z/n, c = (p + z*z/(2*n)) / d, h = z * Math.sqrt(p*(1-p)/n + z*z/(4*n*n)) / d; return [c - h, c + h]; }

/* ============================== Indicateurs ============================== */
const IND = {
  sma(a, n) { const o = Array(a.length).fill(null); let s = 0; for (let i = 0; i < a.length; i++) { s += a[i]; if (i >= n) s -= a[i-n]; if (i >= n-1) o[i] = s/n; } return o; },
  smaN(a, n) { const o = Array(a.length).fill(null); for (let i = n-1; i < a.length; i++) { let s = 0, good = true; for (let j = i-n+1; j <= i; j++) { if (a[j] == null) { good = false; break; } s += a[j]; } if (good) o[i] = s/n; } return o; },
  ema(a, n) { const o = Array(a.length).fill(null), k = 2/(n+1); let e = null, s = 0, c = 0;
    for (let i = 0; i < a.length; i++) { const x = a[i]; if (x == null) continue;
      if (e == null) { s += x; c++; if (c === n) { e = s/n; o[i] = e; } } else { e = x*k + e*(1-k); o[i] = e; } } return o; },
  rsi(c, n = 14) { const o = Array(c.length).fill(null); let g = 0, l = 0;
    for (let i = 1; i < c.length; i++) { const d = c[i] - c[i-1], up = Math.max(d, 0), dn = Math.max(-d, 0);
      if (i <= n) { g += up; l += dn; if (i === n) { g /= n; l /= n; o[i] = l === 0 ? 100 : 100 - 100/(1 + g/l); } }
      else { g = (g*(n-1) + up)/n; l = (l*(n-1) + dn)/n; o[i] = l === 0 ? 100 : 100 - 100/(1 + g/l); } } return o; },
  macd(c, f = 12, s = 26, g = 9) { const a = IND.ema(c, f), b = IND.ema(c, s);
    const m = a.map((x,i) => x != null && b[i] != null ? x - b[i] : null); const sig = IND.ema(m, g);
    return { m, sig, h: m.map((x,i) => x != null && sig[i] != null ? x - sig[i] : null) }; },
  stoch(h, l, c, n = 14, sm = 3) { const raw = c.map((x,i) => { if (i < n-1) return null; let hh = -Infinity, ll = Infinity;
      for (let j = i-n+1; j <= i; j++) { if (h[j] > hh) hh = h[j]; if (l[j] < ll) ll = l[j]; } return hh === ll ? 50 : (x - ll)/(hh - ll)*100; });
    const k = IND.smaN(raw, sm); return { k, d: IND.smaN(k, sm) }; },
  boll(c, n = 20, k = 2) { const m = IND.sma(c, n), up = [], dn = [];
    for (let i = 0; i < c.length; i++) { if (m[i] == null) { up.push(null); dn.push(null); continue; }
      let s = 0; for (let j = i-n+1; j <= i; j++) s += (c[j] - m[i])**2; const d = Math.sqrt(s/n); up.push(m[i] + k*d); dn.push(m[i] - k*d); }
    return { m, up, dn }; },
  atr(h, l, c, n = 14) { const N = c.length, o = Array(N).fill(null); let a = null, s = 0;
    for (let i = 0; i < N; i++) { const tr = i === 0 ? h[i] - l[i] : Math.max(h[i] - l[i], Math.abs(h[i] - c[i-1]), Math.abs(l[i] - c[i-1]));
      if (i < n) { s += tr; if (i === n-1) { a = s/n; o[i] = a; } } else { a = (a*(n-1) + tr)/n; o[i] = a; } } return o; },
  supertrend(h, l, c, n = 10, m = 3) { const at = IND.atr(h, l, c, n), N = c.length, st = Array(N).fill(null), dir = Array(N).fill(null);
    let fu = null, fl = null, d = 1;
    for (let i = 0; i < N; i++) { if (at[i] == null) continue; const hl = (h[i] + l[i])/2, bu = hl + m*at[i], bl = hl - m*at[i];
      if (fu == null) { fu = bu; fl = bl; } else { fu = (bu < fu || c[i-1] > fu) ? bu : fu; fl = (bl > fl || c[i-1] < fl) ? bl : fl; }
      if (d === 1 && c[i] < fl) d = -1; else if (d === -1 && c[i] > fu) d = 1;
      st[i] = d === 1 ? fl : fu; dir[i] = d; } return { st, dir }; },
  adx(h, l, c, n = 14) { const N = c.length, pdi = Array(N).fill(null), mdi = Array(N).fill(null), adx = Array(N).fill(null), dx = Array(N).fill(null);
    let str = 0, sp = 0, sm = 0;
    for (let i = 1; i < N; i++) { const up = h[i] - h[i-1], dn = l[i-1] - l[i];
      const p = up > dn && up > 0 ? up : 0, q = dn > up && dn > 0 ? dn : 0;
      const tr = Math.max(h[i] - l[i], Math.abs(h[i] - c[i-1]), Math.abs(l[i] - c[i-1]));
      if (i <= n) { str += tr; sp += p; sm += q; if (i < n) continue; } else { str = str - str/n + tr; sp = sp - sp/n + p; sm = sm - sm/n + q; }
      pdi[i] = str ? 100*sp/str : 0; mdi[i] = str ? 100*sm/str : 0; const s = pdi[i] + mdi[i]; dx[i] = s ? 100*Math.abs(pdi[i] - mdi[i])/s : 0; }
    let a = null, cnt = 0, acc = 0;

  for (const x of L) { const w = def.w === 'cap' ? (x.cap || 0) : def.w === 'val' ? (x.valMed || 0) + 1 : 1; wts[x.t] = w; tw += w; }
  if (monthly) { const keys = [...new Set(L.flatMap(x => (S.byT[x.t].m || []).map(m => m[0])))].filter(k => k >= 201112).sort((a, b) => a - b); const mp = {}; for (const x of L) mp[x.t] = new Map(S.byT[x.t].m || []);
    const out = [[keys[0], 100]]; let v = 100; for (let i = 1; i < keys.length; i++) { let r = 0, ws = 0; for (const x of L) { const a = mp[x.t].get(keys[i-1]), b = mp[x.t].get(keys[i]); if (a && b) { r += wts[x.t]*(b/a - 1); ws += wts[x.t]; } } if (ws) v *= 1 + r/ws; out.push([keys[i], v]); } return { L, out }; }
  const cal = S.cal; const maps = {}; for (const x of L) { const T = S.byT[x.t]; maps[x.t] = new Map(T.d.map((d, i) => [d, T.c[i]])); }
  const lastPx = {}; const out = []; let v = 100;
  for (let i = 0; i < cal.length; i++) { const d = cal[i]; let r = 0, ws = 0;
    for (const x of L) { const p = maps[x.t].get(d); const prev = lastPx[x.t]; if (prev && p) { r += wts[x.t]*(p/prev - 1); ws += wts[x.t]; } else if (prev) ws += wts[x.t]; if (p) lastPx[x.t] = p; }
    if (i > 0 && ws) v *= 1 + r/ws; out.push([d, v]); }
  return { L, out };

/* ============================== Vue : Fraîcheur ============================== */
function vFraicheur() {
  const s = S.status || {}, se = s.seance || {}, L = (S.live && S.live._meta) || {};
  const age = iso => { if (!iso) return ''; const m = (Date.now() - Date.parse(iso))/6e4; return m < 0 ? '' : m < 90 ? `il y a ${Math.round(m)} min` : m < 48*60 ? `il y a ${Math.round(m/60)} h` : `il y a ${Math.round(m/1440)} j`; };
  const rows = [
    ['Relevé de séance', `${esc(se.origine || L.origine || '—')}`, `${F.dt(se.releve_utc)} · ${age(se.releve_utc)}`, se.brvm_ok === false ? chip('brvm.org injoignable', 'w') : se.brvm_ok ? chip('brvm.org', 'g') : ''],
    ['Mise à jour BRVM', `Séance ${esc(se.etat || '—')}, cours différés de ${se.delai_minutes || 15} min`, se.maj_brvm ? `${F.iso(se.maj_brvm)} ${se.maj_brvm.slice(11, 16)} GMT` : F.iso(se.date), ''],
    ['Historiques (miroir public)', 'github.com/harzat/brvm-data-public', `${F.dt(s.miroir_commit)} · ${age(s.miroir_commit)}`, ''],
    ['Comptes annuels', 'SikaFinance', F.iso(s.fondamentaux), ''],
    ['Dividendes', 'Avis BRVM + SikaFinance', `${F.dt(s.dividendes)} · ${age(s.dividendes)}`, ''],
    ['Avis et publications', 'brvm.org', `${F.dt(s.avis)} · ${age(s.avis)}`, ''],
    ['Bulletin officiel de la cote', s.boc_url ? `<a href="${esc(s.boc_url)}" target="_blank" rel="noopener">BOC du ${F.iso(s.boc)}</a>` : '—', '', ''],
    ['Construction du terminal', 'Pipeline FOFCO', `${F.dt(s.generated_at || S.core.generated_at)} · ${age(s.generated_at || S.core.generated_at)}`, ''],
  ];
  const susp = Object.entries(s.suspensions || {});
  view.innerHTML = `<div class="stack fade"><div class="ph"><div><div class="eyebrow">Vérifier avant d’agir</div><h1>Fraîcheur des données</h1></div></div>
    <div class="tw"><table><tbody>${rows.map(r => `<tr><td><b>${r[0]}</b></td><td style="white-space:normal">${r[1]}</td><td class="num">${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>
    ${susp.length ? `<div class="panel"><h3>Cotations suspendues</h3>${susp.map(([t, v]) => `<div>${chip(t, 'r')} depuis le ${F.iso(v.date)} · avis ${esc(v.avis || '')}</div>`).join('')}</div>` : ''}
    <div class="panel"><h2>Méthode</h2><div class="note" style="max-width:none;display:grid;gap:8px;font-size:13px;color:var(--ink)">
      <p><b>Mise à jour.</b> Une GitHub Action du dépôt fofco-brvm-terminal relève brvm.org (cours officiels) et SikaFinance (plus haut, plus bas, valeur) toutes les 15 minutes pendant la séance, fusionne le miroir public des historiques, puis reconstruit les fichiers sur la branche data. Cette page privée les recopie toutes les heures en séance (et à 19 h 40 GMT), ou tout de suite avec le bouton Actualiser. Les cours BRVM sont eux-mêmes différés de 15 minutes. Les CSV du miroir sont lus dans leur ordre réel (clôture, ouverture, plus haut, plus bas).</p>
      <p><b>Indicateurs.</b> MM 20/50/100, RSI 14 (Wilder), MACD 12/26/9, stochastique 14 lissé 3, Bollinger 20 ±2σ, Z-score 252 (minimum 20, très étiré au-delà de 2,2), Supertrend ATR 10 × 3, ADX/DI 14, OBV, Donchian 252, cassures ATR 14 sur 20 séances, Ichimoku 9/26/52, profil de volume 36 niveaux (zone de valeur 70 %), doubles sommets/creux (pivots 3 %, tolérance 2 %, 5–60 séances).</p>
      <p><b>Phases.</b> Distance au plus haut 20 séances (seuil 3,2 %), histogramme MACD, RSI (60) et MM50. Une phase s’affiche à sa deuxième séance consécutive. Tension : RSI ≥ 70 ou ≤ 30, cours > MM20 + 10 %, ou hausse > 20 % en 20 séances.</p>
      <p><b>Scores.</b> Pondérations et seuils publiés par BRVMetrics (méthode v1.20) ; les sous-composantes sont calculées ici. Qualité : tendance 30, timing 25, prix payé 20, risque 15, dividende 10 ; garde-fous RSI > 70, Z > 2,2, +25 % en 20 séances, liquidité < 35. Contexte : marché 45, comptes 30, liquidité 25. Note des comptes : 5 critères à 20 %, pairs du secteur ou banques / non-banques. Liquidité : valeur moyenne 50 % (points log : 100 k → 0, 500 k → 30, 2 M → 50, 10 M → 75, 50 M → 100), fréquence 30 %, écart haut-bas 20 %. Aucun de ces scores ne prédit le rendement futur : les tests publiés ne trouvent aucun indicateur isolé rentable après frais.</p>
      <p><b>Stratégie.</b> Règle MM80 / MM150 (entrée au croisement, sortie 5 % sous la MM80), achat-conservation en référence, frais par défaut ≈ 2,96 % aller-retour, trésorerie à 4,5 %, dividendes nets au détachement.</p>
      <p><b>Sources.</b> Les données restent la propriété de la BRVM, de SikaFinance et de RicheBourse, via le miroir public de BRVMetrics. Usage personnel, sans garantie d’exactitude. Ce n’est pas un conseil en investissement.</p></div></div></div>`;
}

/* ============================== Démarrage ============================== */
async function boot() {
  loadPrefs();
  const h = (location.hash || '').slice(1); if (h) { const [tab, t] = h.split('-'); if (TABS.some(x => x[0] === tab)) S.tab = tab; if (t) S.fiche = t.toUpperCase(); }
  try { await loadCore(); } catch (e) { view.innerHTML = `<div class="empty">Impossible de charger les données (${esc(e.message)}). Réessaie dans un instant.</div>`; return; }
  render(); loadEvents().then(() => { if (S.tab === 'screener') drawTable(); if (S.tab === 'marche') vMarche(); });
  initPrefSync();
  // Vérifie toutes les 5 minutes si de nouvelles données ont été publiées
  setInterval(async () => { try { const st = await getJSON('data/status.json'); if (st.generated_at && S.status && st.generated_at !== S.status.generated_at) { const keep = S.events; await loadCore(); S.events = keep; S.hist = {}; computeEventFlags(); if (!['strategie', 'fiche'].includes(S.tab)) render(); else renderHeader(); } } catch (e) {} }, 5*60*1000);
  const rerender = () => { if (['fiche', 'strategie', 'indices', 'fofco', 'saison'].includes(S.tab)) render(); };
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerender); } catch (e) {}
  new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
boot();
</script>
